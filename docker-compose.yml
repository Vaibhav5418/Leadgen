services:
  backend:
    build:
      context: ./leadgen-backend
      dockerfile: Dockerfile
    container_name: leadgen-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - ./leadgen-backend/.env
    networks:
      - leadgen-network

  frontend:
    build:
      context: ./leadgen-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: leadgen-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - leadgen-network

networks:
  leadgen-network:
    driver: bridge
